name: Update DisplayCAL fortnightly

on:
  schedule:
    # GitHub cron has no fortnight interval. The gate below skips alternate Mondays.
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-displaycal
  cancel-in-progress: false

jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=$(python3 scripts/update_displaycal.py --due)" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: cadence
    if: needs.cadence.outputs.due == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_AUTOREMOVE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test updater
        run: python3 -m unittest discover -s tests -v
      - name: Prepare version and verified checksums
        id: update
        run: python3 scripts/update_displaycal.py
      - name: Validate the proposed cask and both suites
        if: steps.update.outputs.updated == 'true'
        run: |
          brew style Casks/displaycal-py3.rb
          brew tap --custom-remote a-t-eight/tap "$GITHUB_WORKSPACE"
          cp Casks/displaycal-py3.rb "$(brew --repository a-t-eight/tap)/Casks/displaycal-py3.rb"
          brew audit --cask a-t-eight/tap/displaycal-py3
          bash scripts/verify_displaycal.sh work/displaycal
      - name: Prepare PR description
        if: steps.update.outputs.updated == 'true'
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          {
            printf 'Update DisplayCAL to [%s](https://github.com/eoyilmaz/displaycal-py3/releases/tag/%s).\n\n' "$VERSION" "$VERSION"
            printf 'Both DMGs were downloaded and independently hashed against GitHub release digests.\n\n'
            cat work/displaycal/validation.md
            printf '\nAutomated checks do not verify GUI operation or instrument calibration. Manual merge required.\n'
          } > work/displaycal/pr-body.md
      - name: Open or update the release PR
        if: steps.update.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ github.token }}
          branch: automation/displaycal-py3
          commit-message: "displaycal-py3: update to ${{ steps.update.outputs.version }}"
          title: "displaycal-py3: update to ${{ steps.update.outputs.version }}"
          body-path: work/displaycal/pr-body.md
          add-paths: Casks/displaycal-py3.rb
      - name: Retain validation and signing results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: displaycal-update-validation
          path: |
            work/displaycal/*.md
            work/displaycal/*.json
            work/displaycal/*.log
          if-no-files-found: ignore
          retention-days: 30
